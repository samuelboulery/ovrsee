name: Signaler un bug
description: L'application plante, ou ne fait pas ce qu'elle annonce.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci du signalement. Un point avant de commencer : s'il s'agit d'une
        **faille de sécurité**, ne l'écrivez pas ici — passez par
        [Security Advisories](https://github.com/samuelboulery/ovrsee/security/advisories/new),
        le signalement y reste privé.

  - type: textarea
    id: quoi
    attributes:
      label: Ce qui se passe
      description: Et ce que vous attendiez à la place.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Ouvrir l'onglet Produit
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Système
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Autre
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version d'Ovrsee
      description: Visible dans « À propos », ou le nom du fichier téléchargé.
      placeholder: 1.0.0-beta
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Comment vous l'avez lancée
      description: Le protocole `ovrsee://` d'Electron et le dev server Vite n'ont pas les mêmes en-têtes — un bug peut n'exister que dans l'un des deux.
      options:
        - L'application empaquetée (DMG ou installeur)
        - "pnpm electron"
        - "pnpm dev (navigateur)"
    validations:
      required: true

  - type: textarea
    id: contexte
    attributes:
      label: Captures, journaux, contexte
      description: Facultatif. Vérifiez qu'aucun jeton ni chemin privé ne traîne dans ce que vous collez.
