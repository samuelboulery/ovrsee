name: ci

# Avant ce workflow, rien ne testait le dépôt entre deux tags. Cinq tests de
# portabilité cassaient sous Windows depuis des semaines — séparateurs `\`, bit
# d'exécution absent, EPERM au lieu d'EISDIR — et c'est le premier
# `git push --tags` qui les a découverts, en faisant échouer la release.
# Sans filtre de chemins, et ce n'est pas un oubli. `paths-ignore` et les
# « status checks requis » du ruleset ne se combinent pas : une PR qui ne touche
# qu'un chemin ignoré ne déclenche aucun run, les trois contextes attendus ne
# remontent jamais, et la PR devient infusionnable pour toujours. Constaté sur
# la PR #7, qui ne changeait qu'un ticket.
#
# Faire tourner la CI sur une PR de documentation coûte deux minutes de runner,
# gratuites sur un dépôt public. C'est moins cher qu'un second workflow miroir
# dont le seul rôle serait de déclarer verts des contextes qu'il n'a pas testés.
on:
  pull_request:
  push:
    branches: [main]

# Les noms de jobs sont les contextes cités par le ruleset de `main` : les
# renommer casserait la règle en silence, et les PR passeraient sans contrôle.
#
# Rien par défaut, et chaque job redemande le strict nécessaire. `contents: read`
# n'est pas décoratif : sans lui `actions/checkout` n'a pas de jeton pour cloner
# et `git` sort en 128. Le premier run de cette CI l'a découvert.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build:ui

  # Deux runners, deux sémantiques de chemins et de permissions. Ubuntu
  # n'apporterait pas de troisième environnement utile : personne ne fait
  # tourner l'application dessus.
  test-mac:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  test-win:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
