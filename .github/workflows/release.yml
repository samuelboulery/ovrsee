name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Pas de permissions au niveau du workflow : seul le job qui crée la release en
# a besoin. Déclarées ici, elles seraient accordées aussi aux jobs de build, qui
# n'écrivent rien — sauf electron-builder, qui reçoit le jeton par `env`.
permissions: {}

# Pas de `concurrency` avec annulation ici, contrairement à la CI : annuler un
# build à mi-envoi laisse une release à moitié remplie. C'est arrivé.

jobs:
  # `electron-builder --publish` crée la release brouillon à la volée, au
  # premier envoi d'asset — et ses envois sont parallèles. Deux d'entre eux ont
  # déjà trouvé « pas de release » au même instant et en ont créé une chacun,
  # les assets répartis entre les deux. La créer ici, une fois, avant que le
  # moindre runner ne démarre, supprime la course.
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Pas de checkout : `gh` travaille sur `$GITHUB_REPOSITORY`, et
      # `--generate-notes` se calcule côté serveur.
      - name: Créer la release brouillon si elle n'existe pas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # `workflow_dispatch` part d'une branche, pas d'un tag : rien à créer.
          case "$GITHUB_REF" in refs/tags/*) ;; *) echo 'pas un tag'; exit 0 ;; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --title "${TAG#v}" --generate-notes

  build:
    needs: draft
    strategy:
      # Sans ça, l'échec du job windows annule le job mac en cours d'envoi et
      # laisse une release à moitié remplie.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build:ui

      - run: pnpm exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
