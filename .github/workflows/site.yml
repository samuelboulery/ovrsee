name: site

# La vitrine est statique. Une seule chose se construit : `site/fr/index.html`, la
# version française, dérivée de `site/index.html` et `site/dict.json` — générée ici
# plutôt que commitée, pour qu'elle ne puisse pas dériver de sa source. Le script n'a
# aucune dépendance : le `node` du runner suffit, pas d'installation.
#
# Le filtre de chemins évite qu'un changement de code relance un déploiement — et,
# symétriquement, `ci.yml` ignore `site/**`.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site-fr.js'
      # Le numéro de version affiché en est estampillé : un bump republie la page.
      - 'package.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions: {}

# Un seul déploiement à la fois, et le plus récent gagne : deux publications
# concurrentes sur Pages se refusent mutuellement.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: node scripts/build-site-fr.js

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
