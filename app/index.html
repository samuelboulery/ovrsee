<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ovrsee</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      /*
        Le fond d'avant le premier paint.

        Le réglage vit sur le disque et arrive par `/api/settings` : trop tard
        pour peindre. Un script inline le lirait dans `localStorage` — et
        serait bloqué par la CSP du protocole `ovrsee://`, en silence côté
        navigateur où il fonctionne très bien. D'où ce CSS, qui n'a pas ce
        problème : il suit le poste, donc le réglage `système`, qui est le
        défaut. Le cas qui reste — un choix EXPLICITE contraire au poste —
        est celui d'Electron, et c'est justement là que `backgroundColor`
        (electron/main.js) lit le vrai réglage et peint juste.

        Les deux valeurs de `--color-bg`, en dur : la feuille du design system
        n'est pas encore chargée à cet instant.
      */
      body { margin: 0; background: #08090a; }
      @media (prefers-color-scheme: light) { body { background: #eceef1; } }
      html[data-theme='dark'] body { background: #08090a; }
      html[data-theme='light'] body { background: #eceef1; }
      a { color: var(--color-accent-300); text-decoration: none; }
      a:hover { color: var(--color-accent-200); }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      * { scrollbar-width: thin; scrollbar-color: var(--color-neutral-700) var(--color-bg); }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: var(--color-bg); }
      ::-webkit-scrollbar-thumb { background: var(--color-neutral-700); border-radius: 5px; border: 2px solid var(--color-bg); }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-neutral-600); }
      ::-webkit-scrollbar-corner { background: var(--color-bg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
