appId: com.samboulery.ovrsee
productName: Ovrsee
copyright: © 2026 Samuel Boulery

directories:
  output: release
  buildResources: build

files:
  - electron/**
  - server/**
  - hooks/**
  # Les SKILL.md que l'application propose d'installer dans ~/.claude/skills/.
  # Sans eux, le panneau des skills n'aurait rien à copier.
  - skills/**
  - app/dist/**
  - package.json
  # Le crawl et le serveur MCP. Sans eux, l'application livrée serait une
  # visionneuse : elle saurait lire un `ovrsee/` mais pas le produire, et il
  # faudrait cloner le dépôt pour cartographier un projet.
  - crawl/**
  - mcp/**
  # Les modules réellement chargés par le processus principal. Le reste
  # (Vite, React, TypeScript) ne sert qu'au développement.
  - node_modules/node-pty/**
  # WHY: le pilote du crawl. 13 Mo, aucune dépendance transitive, et aucun
  # navigateur embarqué — `channel: 'chrome'` pilote le Chrome du système.
  #
  # Il est en `dependencies` et pas en `devDependencies`, et ce n'est pas un
  # détail de rangement : electron-builder élague les dépendances de
  # développement, et cette ligne seule ne suffisait pas à le retenir. Le paquet
  # sortait sans lui, et le crawl échouait sur `ERR_MODULE_NOT_FOUND` — invisible
  # en dev, où le dossier est là de toute façon.
  - node_modules/playwright-core/**

# Un binaire natif ne peut pas être chargé depuis une archive asar : il doit
# exister comme fichier sur le disque. `spawn-helper` doit en plus conserver
# son bit d'exécution — c'est le point de rupture classique de l'empaquetage,
# et il ne se voit qu'à l'exécution de l'application livrée.
asar: true
asarUnpack:
  - node_modules/node-pty/**

# Publie sur l'onglet Releases du dépôt (privé) — la CI y attache les
# installeurs à chaque tag `v*`, voir .github/workflows/release.yml.
publish:
  provider: github
  owner: samuelboulery
  repo: ovrsee

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
  darkModeSupport: true
  # Pas de signature ni de notarisation pour l'instant : usage personnel, et
  # Gatekeeper se contourne au premier lancement. Elles deviendront
  # obligatoires le jour d'une distribution publique.
  identity: null
  # Sans version dans le nom : un lien /releases/latest/download/… reste
  # valable d'une sortie à l'autre.
  artifactName: 'Ovrsee-mac-${arch}.${ext}'

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: 'Ovrsee-win-${arch}.${ext}'
