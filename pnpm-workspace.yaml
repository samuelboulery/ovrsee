# pnpm ≥ 10 bloque par défaut les scripts d'installation des dépendances.
# C'est une protection, pas une gêne : c'est le vecteur qu'a emprunté le ver
# ChainDrop. On autorise donc nommément, et uniquement, les paquets qui ont
# réellement besoin de compiler.
#
# node-pty est un module natif : sans son script de compilation, il n'y a pas
# de binaire, donc pas de terminal.
#
# En pnpm 11 la clé est `allowBuilds` et c'est une **map**, pas une liste :
# l'ancien `onlyBuiltDependencies` est encore lu mais n'autorise plus rien, en
# silence — et une liste sous `allowBuilds` non plus.
allowBuilds:
  node-pty: true
  # electron-builder n'en a besoin que pour l'installeur Windows, construit sur
  # un runner natif ; rien ici ne le compile.
  electron-winstaller: false

# Quarantaine de 24 h sur les versions fraîchement publiées.
#
# Le 2026-08-04, le ver ChainDrop a empoisonné 444 paquets npm en moins de
# quatre heures via un hook `preinstall`. Les retraits arrivent, mais après
# coup : refuser une version de moins d'un jour laisse le temps au registre de
# la retirer avant qu'elle n'atteigne ce dépôt.
#
# Ce réglage vivait dans `.npmrc` jusqu'à pnpm 11, qui n'y lit plus que
# l'authentification et le registre : la ligne y était devenue muette, et la
# quarantaine levée sans que rien ne le dise. Même piège que
# `onlyBuiltDependencies` ci-dessus, sur le réglage voisin. Vérification :
# `pnpm config get minimumReleaseAge` doit rendre 1440, pas `undefined`.
minimumReleaseAge: 1440

# @phosphor-icons/react publie dist/index.cjs.js (syntaxe CommonJS) sous un
# package.json racine "type": "module", sans package.json imbriqué dans
# dist/ pour corriger la détection — Node lit donc ce fichier comme de
# l'ESM et plante sur `exports is not defined`. Le patch ajoute juste ce
# package.json manquant (dist/ → "type": "commonjs"), sans toucher au code
# du paquet. Casse `pnpm test` (app/.test-build compilé en CommonJS) sinon.
patchedDependencies:
  '@phosphor-icons/react': patches/@phosphor-icons__react.patch

# Correctifs de sécurité de l'outillage d'empaquetage (alertes Dependabot,
# T-0276). Tout vient d'electron-builder et d'@electron/get, déjà en dernière
# version : leurs plages bloquent encore la version corrigée, on la force ici.
# Rien de ceci n'est livré dans l'application (`pnpm audit --prod` était vide).
# Une entrée par branche majeure : forcer une autre majeure casserait l'appelant.
# À retirer quand electron-builder aura suivi — `pnpm audit` le dira.
overrides:
  '@xmldom/xmldom@<0.8.15': 0.8.15
  'fast-uri@<3.1.8': 3.1.8
  'js-yaml@>=4 <4.3.2': 4.3.2
  'undici@>=6 <6.29.0': 6.29.0
  'undici@>=7 <7.30.0': 7.30.0
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2 <2.1.7': 2.1.7
  'brace-expansion@>=5 <5.0.12': 5.0.12
  'http-cache-semantics@<4.3.0': 4.3.0
