# pnpm ≥ 10 bloque par défaut les scripts d'installation des dépendances.
# C'est une protection, pas une gêne : c'est le vecteur qu'a emprunté le ver
# ChainDrop. On autorise donc nommément, et uniquement, les paquets qui ont
# réellement besoin de compiler.
#
# node-pty est un module natif : sans son script de compilation, il n'y a pas
# de binaire, donc pas de terminal.
onlyBuiltDependencies:
  - node-pty

# @phosphor-icons/react publie dist/index.cjs.js (syntaxe CommonJS) sous un
# package.json racine "type": "module", sans package.json imbriqué dans
# dist/ pour corriger la détection — Node lit donc ce fichier comme de
# l'ESM et plante sur `exports is not defined`. Le patch ajoute juste ce
# package.json manquant (dist/ → "type": "commonjs"), sans toucher au code
# du paquet. Casse `pnpm test` (app/.test-build compilé en CommonJS) sinon.
patchedDependencies:
  '@phosphor-icons/react': patches/@phosphor-icons__react.patch
